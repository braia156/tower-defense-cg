<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tower Defense WebGL</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; user-select: none; overflow: hidden; }
        #gameContainer { position: relative; width: 800px; height: 600px; }
        canvas { border: 1px solid #333; display: block; cursor: crosshair; }
        #hud { position: absolute; top: 15px; left: 20px; color: #fff; font-family: sans-serif; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 2px #000; pointer-events: none; }
        #indicadorBuff { display: none; position: absolute; top: 50px; left: 50%; transform: translateX(-50%); color: #facc15; font-family: sans-serif; font-size: 22px; font-weight: bold; text-shadow: 2px 2px 2px #000; pointer-events: none; }
        #dicaTelaCheia { position: absolute; bottom: 15px; right: 20px; color: #fff; font-family: sans-serif; font-size: 14px; text-shadow: 2px 2px 2px #000; pointer-events: none; }

        #telaGameOver { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); flex-direction: column; justify-content: center; align-items: center; color: #fff; font-family: sans-serif; z-index: 20; }
        #telaPause { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); flex-direction: column; justify-content: center; align-items: center; color: #fff; font-family: sans-serif; pointer-events: none; z-index: 10; }
        
        button { padding: 10px 20px; font-size: 18px; font-weight: bold; cursor: pointer; background: #e2e8f0; border: none; border-radius: 4px; margin-top: 20px; pointer-events: auto; }
        button:hover { background: #cbd5e1; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="hud">
            ❤️ Torre: <span id="uiVida">100</span> | 🎯 Pontos: <span id="uiPontos">0</span> | ⚔️ Nível: <span id="uiNivel">1</span> | 🪙 Moedas: <span id="uiMoedas">0</span>/10
        </div>

        <div id="dicaTelaCheia">Pressione F para tela cheia</div>

        <div id="indicadorBuff">⚡ DEDADA FORTE: <span id="uiTempoBuff">7</span>s</div>

        <div id="telaPause">
            <h1 style="font-size: 48px; margin: 0;">PAUSADO</h1>
        </div>

        <div id="telaGameOver">
            <h1 style="font-size: 48px; margin: 0; color: #ef4444;">GAME OVER</h1>
            <button id="btnReiniciar">Tentar Novamente</button>
        </div>
    </div>

    <script src="main.js" type="module"></script>
</body>
</html>
